name: validate-examples

# Validates the actualized b24jssdk TS + UMD examples via .actualize/validate.py
# and runs the offline unit tests for the tooling itself.
# The .actualize/ tooling must already be on the default branch, so the tooling
# PR is merged before this workflow can check documentation PRs.
#
# Shape: `prepare` works out which pages need validating (see
# .actualize/ci/changed-examples.sh) and how many runners to spread them over;
# `validate` is a matrix over that many shards. A routine PR touches a handful of
# pages and runs on a single shard. A corpus-wide change — an upstream resync
# rewrites ~1500 pages — fans out instead of walking into the job timeout, which
# is what a single serial runner did (~2s/page against a 20 minute limit).
# Nothing is capped or sampled: every qualifying page is validated on some shard.
#
# Security notes:
#   - on pull_request the checkout is the PR *merge ref* (PR-controlled), so jobs
#     are restricted to same-repo PRs; fork PRs do not run the npm/tsc/python chain;
#   - the token is read-only (permissions: contents: read) and not persisted;
#   - validate.py only type-checks (tsc) and parses (node --check) — it never
#     executes the example code; npm runs with --ignore-scripts from a lockfile.

on:
  pull_request:
    paths:
      - 'api-reference/**/*.md'
      - '.actualize/**'
      - '.github/workflows/validate-examples.yml'
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Pages per runner, and the ceiling on how many runners to ask for. The shard
  # count is ceil(total / PER_SHARD) clamped to MAX_SHARDS, so cost tracks the
  # size of the change instead of being paid on every PR.
  PER_SHARD: 120
  MAX_SHARDS: 12

jobs:
  test-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Unit tests (offline, stdlib)
        run: python -m unittest discover -s .actualize/tests -p 'test_*.py' -v

      - name: run-batch.sh orchestration tests (offline, stubbed agent)
        run: bash .actualize/tests/test_run_batch.sh

      - name: run-section.sh auto-retry tests (offline, stubbed agent)
        run: bash .actualize/tests/test_run_section.sh

      - name: contribute-to-upstream.sh hand-off tests (offline, local remotes)
        run: bash .actualize/tests/test_contribute_upstream.sh

      - name: changed-examples.sh selection/sharding tests (offline)
        run: bash .actualize/tests/test_changed_examples.sh

  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      total: ${{ steps.collect.outputs.total }}
      shards: ${{ steps.collect.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Collect changed example files
        id: collect
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.sha }}'
          else
            base='${{ github.event.before }}'
          fi
          bash .actualize/ci/changed-examples.sh "$base" > changed.txt
          total="$(wc -l < changed.txt | tr -d ' ')"
          shards=$(( (total + PER_SHARD - 1) / PER_SHARD ))
          if [ "$shards" -lt 1 ]; then shards=1; fi
          if [ "$shards" -gt "$MAX_SHARDS" ]; then shards="$MAX_SHARDS"; fi
          echo "total=$total" >> "$GITHUB_OUTPUT"
          jq -nc --argjson n "$shards" '[range($n)]' \
            | sed 's/^/shards=/' >> "$GITHUB_OUTPUT"
          echo "Pages to validate: $total, across $shards shard(s)"
          echo "::group::changed example files"; cat changed.txt; echo "::endgroup::"

      - uses: actions/upload-artifact@v4
        with:
          name: changed-examples
          path: changed.txt
          retention-days: 1

      - name: Verify ledger drift (push to main, informational)
        if: github.event_name == 'push'
        continue-on-error: true
        run: python3 .actualize/record.py --verify-all

  validate:
    needs: prepare
    if: needs.prepare.outputs.total != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache typecheck toolchain
        uses: actions/cache@v4
        with:
          path: .actualize/.tscheck
          key: tscheck-${{ runner.os }}-${{ hashFiles('.actualize/typecheck/package-lock.json') }}

      - uses: actions/download-artifact@v4
        with:
          name: changed-examples

      - name: Validate TS + UMD examples
        run: |
          shards='${{ strategy.job-total }}'
          bash .actualize/ci/changed-examples.sh \
            --shard "${{ matrix.shard }}/$shards" changed.txt > shard.txt
          echo "shard ${{ matrix.shard }} of $shards: $(wc -l < shard.txt | tr -d ' ') page(s)"
          rc=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            echo "::group::validate $f"
            python3 .actualize/validate.py "$f" || rc=1
            echo "::endgroup::"
          done < shard.txt
          exit $rc
